name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before the build: its base_path output tells Astro whether the
      # site lives at a domain root or under the /CLOIE-Blog subpath.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      # No SPA fallback step is needed: Astro emits a real
      # dist/chapter1/index.html (and dist/404.html from src/pages/404.astro),
      # so GitHub Pages serves /chapter1 directly and a hard reload or a deep
      # link from a bookmark works without the History API.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
